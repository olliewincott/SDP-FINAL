{% load static %}

<!-- Scrollable Daily Calendar Container -->
<div id="daily-calendar-container">
    <div id="dashboard-calendar"></div>
</div>

<!-- FullCalendar Scripts -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.js"></script>

<style>
    /* Scrollable Container for Daily View */
    #daily-calendar-container {
        width: 100%;
        max-width: 100%;
        height: 650px; /* Container height increased */
        overflow-y: auto;
        background-color: #2c2c2e;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Fix Scrolling for FullCalendar */
    .fc-timegrid-container {
        max-height: 650px; /* Ensures full rendering */
        overflow-y: auto !important;
    }

    /* Remove Date Header */
    .fc-toolbar {
        display: none !important;
    }

    /* Ensure Hourly Grid Lines */
    .fc-timegrid-slot {
        border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('dashboard-calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        themeSystem: 'bootstrap',
        initialView: 'timeGridDay',
        height: 650, // Updated height to match the container
        headerToolbar: false, // Removes Date Header
        allDaySlot: false,
        slotMinTime: '06:00:00',
        slotMaxTime: '22:00:00',
        nowIndicator: true,
        slotDuration: '00:30:00',
        slotLabelInterval: '01:00:00',
        events: "{% url 'events_json' %}",

        eventContent: function(arg) {
            return { html: `<span>${arg.event.title}</span>` };
        }
    });

    calendar.render();

    // Auto-scroll to 7AM but allow manual scrolling
    setTimeout(() => {
        var scrollableContainer = document.querySelector(".fc-timegrid-container");
        var hour7 = document.querySelector(".fc-timegrid-slot[data-time='07:00:00']");
        
        if (hour7) {
            scrollableContainer.scrollTop = hour7.offsetTop - 20;
        }
    }, 500);
});
</script>
