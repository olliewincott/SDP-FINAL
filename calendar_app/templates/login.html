{% extends 'base.html' %}
{% load static %}

{% block head %}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#5AC8FA' },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
{% endblock head %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white px-4">
  <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      {% if form.non_field_errors %}
      <div class="mb-4 bg-red-500/20 p-3 rounded-lg text-red-400 text-sm">
        {{ form.non_field_errors }}
      </div>
      {% endif %}

      <div class="mb-4">
        <label for="id_username" class="block text-sm mb-1">Username</label>
        <input type="text" name="username" id="id_username" 
          class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-primary" 
          required>
      </div>

      <div class="mb-6">
        <label for="id_password" class="block text-sm mb-1">Password</label>
        <input type="password" name="password" id="id_password" 
          class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-primary" 
          required>
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-blue-400 text-white font-semibold py-2 rounded-full transition">
        Login
      </button>
    </form>

    <p class="mt-6 text-center text-gray-400 text-sm">
      Don't have an account? 
      <a href="{% url 'register' %}" class="text-primary hover:underline">Register here</a>.
    </p>
  </div>
</div>
{% endblock content %}
