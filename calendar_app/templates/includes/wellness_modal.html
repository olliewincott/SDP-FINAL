<!-- includes/wellness_modal.html -->
<div id="wellnessGoalsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 hidden">
  <div class="bg-white text-gray-800 rounded-xl shadow-lg w-full max-w-md p-6 relative">
    <!-- Close button -->
    <button class="absolute top-4 right-4 text-gray-500 hover:text-gray-700" data-close-modal>&times;</button>

    <form id="wellnessGoalsForm" class="space-y-4">
      <h3 class="text-lg font-semibold mb-4">Update Wellness Goals</h3>
      {% csrf_token %}

      <div>
        <label for="goal-water" class="block font-medium text-sm mb-1">Water Intake Goal (cups)</label>
        <input type="number" id="goal-water" name="water_goal" min="1" value="{{ wellness.water_goal }}" class="w-full px-3 py-2 border rounded-md border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div>
        <label for="goal-breaks" class="block font-medium text-sm mb-1">Movement Breaks Goal</label>
        <input type="number" id="goal-breaks" name="breaks_goal" min="1" value="{{ wellness.breaks_goal }}" class="w-full px-3 py-2 border rounded-md border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div>
        <label for="goal-meals" class="block font-medium text-sm mb-1">Healthy Meals Goal</label>
        <input type="number" id="goal-meals" name="meals_goal" min="1" value="{{ wellness.meals_goal }}" class="w-full px-3 py-2 border rounded-md border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" class="px-4 py-2 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-100" data-close-modal>Cancel</button>
        <button type="submit" class="px-4 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700">Save Goals</button>
      </div>
    </form>
  </div>
</div>
