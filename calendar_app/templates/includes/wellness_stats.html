<style>
  .progress-circle {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 10px auto;
    border-radius: 50%;
    background-color: #1c1c1e;
    border: 3px solid #66afe9;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
  }

  .progress-circle:active {
    animation: pulse 0.3s ease;
  }

  .update-btn {
    background: none;
    border: none;
    color: #66afe9;
    font-size: 1.8rem;
    cursor: pointer;
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .update-btn:hover {
    transform: scale(1.2);
    color: #4a90e2;
  }

  .progress-circle span {
    position: absolute;
    bottom: -24px;
    width: 100%;
    font-size: 0.9rem;
    color: #d1d1d6;
    text-align: center;
  }

  .stat-card h6 {
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
</style>

<div class="d-flex justify-content-between mb-3">
  <div class="stat-card wellness-widget text-center p-2 mx-1 flex-fill" data-type="water">
    <h6>💧 Hydration</h6>
    <div class="progress-circle">
      <button class="update-btn" data-goal="water">
        <i class="fas fa-tint"></i>
      </button>
      <span id="water-progress">--%</span>
    </div>
    <small class="text-muted">Goal: 8 cups</small>
  </div>

  <div class="stat-card wellness-widget text-center p-2 mx-1 flex-fill" data-type="breaks">
    <h6>🧍‍♂️ Breaks</h6>
    <div class="progress-circle">
      <button class="update-btn" data-goal="breaks">
        <i class="fas fa-walking"></i>
      </button>
      <span id="breaks-progress">--%</span>
    </div>
    <small class="text-muted">Goal: 3/day</small>
  </div>

  <div class="stat-card wellness-widget text-center p-2 mx-1 flex-fill" data-type="meals">
    <h6>🍽 Meals</h6>
    <div class="progress-circle">
      <button class="update-btn" data-goal="meals">
        <i class="fas fa-utensils"></i>
      </button>
      <span id="meals-progress">--%</span>
    </div>
    <small class="text-muted">Goal: 3/day</small>
  </div>
</div>
