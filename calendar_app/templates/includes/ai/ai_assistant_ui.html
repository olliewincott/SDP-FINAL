<div class="ai-container">
  <div class="ai-box">
    <div class="ai-header">
      <h2>🧠 Planner Assistant</h2>
      <p>I can help plan your day, schedule tasks, suggest wellness tips, and more.</p>
    </div>

    <div class="suggested-actions">
      <span>📅 Draft today’s agenda</span>
      <span>✏️ Create a new event</span>
      <span>🧘 Wellness break</span>
      <span>📆 Today’s schedule</span>
    </div>

    <!-- Chat Area -->
    <div id="botui-app" class="chat-scroll">
      <bot-ui></bot-ui>
    </div>

    <!-- Custom Input Always Visible -->
    <div class="custom-input-wrapper">
      <input id="custom-user-input" type="text" placeholder="What would you like to do today?">
      <button id="send-user-input" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>
