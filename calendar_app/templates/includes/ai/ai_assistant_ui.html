<div class="flex justify-center p-4">
  <div class="bg-gray-800 rounded-xl p-5 shadow-lg flex flex-col h-[calc(100vh-140px)] w-full max-w-2xl">
    <!-- Header -->
    <div class="mb-4">
      <h2 class="text-2xl font-semibold text-white">🧠 Planner Assistant</h2>
      <p class="text-gray-300 mt-1">I can help plan your day, schedule tasks, suggest wellness tips, and more.</p>
    </div>

    <!-- Suggested Actions -->
    <div class="mb-4 flex flex-wrap gap-2">
      <button data-mode="agenda"
              class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white">
        📅 Draft today’s agenda
      </button>
      <button data-mode="event"
              class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white">
        ✏️ Create a new event
      </button>
      <button data-mode="wellness"
              class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white">
        🧘 Wellness break
      </button>
      <button data-mode="schedule"
              class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white">
        📆 Today’s schedule
      </button>
    </div>

    <!-- Chat Area -->
    <div id="botui-app"
         class="flex-1 overflow-y-auto bg-gray-900 rounded-lg p-3 mb-4">
      <bot-ui></bot-ui>
    </div>

    <!-- Input Bar -->
    <div class="flex gap-2">
      <input id="custom-user-input"
             type="text"
             placeholder="What would you like to do today?"
             class="flex-1 px-4 py-2 rounded-md bg-gray-900 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-primary" />
      <button id="send-user-input"
              class="px-4 py-2 rounded-md bg-primary text-white font-medium hover:bg-primary/90">
        Send
      </button>
    </div>
  </div>
</div>
