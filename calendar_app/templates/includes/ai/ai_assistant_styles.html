<style>
  body {
    background-color: #1e1e1e;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
  }

  .ai-container {
    padding: 20px;
    height: 50vh;
  }

  .ai-box {
    background-color: #2c2c2e;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    height: 93vh;
  }

  .ai-header {
    margin-bottom: 20px;
    text-align: center;
  }

  .ai-header h2 {
    font-size: 1.75rem;
    font-weight: 600;
    color: #f1f1f1;
  }

  .ai-header p {
    color: #a1a1aa;
    font-size: 0.95rem;
    margin: 0;
  }

  .suggested-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
  }

  .suggested-actions span {
    background-color: #3c3c42;
    color: #d1d1d6;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    border: 1px solid #505056;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .suggested-actions span:hover {
    background-color: #4d4d55;
  }

  #botui-app > .botui-container {
    flex-grow: 1;
    background-color: #2f3033 !important;
    overflow-y: auto;
    height: 60vh;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #444;
    scroll-behavior: smooth;
  }

  .botui-message {
    margin-bottom: 16px !important;
    animation: fadeSlideIn 0.4s ease both;
  }

  .botui-message-content {
    background-color: #44444a !important;
    color: #f1f1f1 !important;
    border-radius: 12px !important;
    padding: 12px 16px !important;
    font-size: 0.95rem;
    line-height: 1.5 !important;
    max-width: 80%;
    width: fit-content;
    min-width: 40px;
    animation: bubbleIn 0.3s ease-in-out;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .botui-message-content.human {
    background-color: #007bff !important;
    color: white !important;
    margin-left: auto;
    margin-right: 0;
  }

  .botui-actions-text-input {
    background-color: #1f1f22 !important;
    color: #e6e6e6 !important;
    border: 1px solid #555 !important;
    border-radius: 10px !important;
    padding: 8px 10px !important;
    width: 100% !important;
  }

  .botui-actions-buttons-button {
    background-color: #007bff !important;
    color: white !important;
    border-radius: 20px !important;
    font-size: 0.85rem;
    padding: 6px 14px;
  }

  .custom-input-wrapper {
    display: flex;
    gap: 10px;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid #3a3a3c;
  }

  .custom-input-wrapper input {
    flex-grow: 1;
    padding: 10px 14px;
    border-radius: 10px;
    background-color: #1f1f22;
    color: #f0f0f0;
    border: 1px solid #555;
    font-size: 0.95rem;
  }

  .custom-input-wrapper button {
    border-radius: 10px;
    font-size: 0.9rem;
    padding: 8px 16px;
    background-color: #007bff;
    color: white;
    border: none;
    transition: background 0.2s ease;
  }

  .custom-input-wrapper button:hover {
    background-color: #3399ff;
  }

  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: #44444a;
    color: #f1f1f1;
    border-radius: 12px;
    max-width: fit-content;
    animation: fadeSlideIn 0.4s ease both;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: #ccc;
    border-radius: 50%;
    animation: typing 1.2s infinite ease-in-out;
  }

  .typing-indicator span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .typing-indicator span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes typing {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  @keyframes fadeSlideIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes bubbleIn {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  nav.navbar {
    display: none !important;
  }

  @media (max-width: 768px) {
    .ai-container {
      padding: 10px;
    }

    .ai-box {
      padding: 20px;
    }

    .suggested-actions {
      justify-content: center;
    }

    #botui-app {
      max-height: 50vh;
    }
  }
</style>
