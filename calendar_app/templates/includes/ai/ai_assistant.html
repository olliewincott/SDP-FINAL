{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% block head %}
  <meta charset="UTF-8">
  <title>AI Assistant – PLN AI</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#5AC8FA' },
          fontFamily: { sans: ['Inter','sans-serif'] }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

  <!-- BotUI CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/botui/build/botui.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/botui/build/botui-theme-default.css"/>

  <!-- Custom Overrides -->
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}"/>
  {% endblock head %}
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen">
  <div class="flex">
    {% include 'includes/sidebar.html' %}

    <main class="flex-1 p-4 md:p-6 space-y-6">
      {% include 'includes/topbar.html' with page_title="AI Assistant" %}

      <section class="bg-white text-gray-900 rounded-xl shadow-md p-6">
        {% include 'includes/ai/ai_assistant_ui.html' %}
      </section>
    </main>
  </div>

  {% block page_scripts %}
  <!-- Vue.js (for BotUI) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

  <!-- BotUI JS -->
  <script src="https://cdn.jsdelivr.net/npm/botui/build/botui.min.js"></script>

  <!-- Assistant Logic -->
  <script>
    const botui = new BotUI('botui-app');
    const conversationHistory = [];
    let currentMode = 'event';

    function getCSRFToken() {
      const name = 'csrftoken';
      return document.cookie.split(';').reduce((v,c) => {
        const [k, val] = c.trim().split('=');
        return k===name ? decodeURIComponent(val) : v;
      }, '');
    }

    function sendToAssistant(message) {
      if (!message.trim()) return;
      conversationHistory.push({ role:'user', content:message });
      botui.message.add({ content:message, human:true, cssClass:'human' });
      document.getElementById('custom-user-input').value = '';

      // show typing indicator
      let idx;
      botui.message.add({ type:'html', content:`
        <div class="inline-flex gap-2 px-4 py-2 bg-gray-800 rounded-full">
          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-150"></span>
          <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-300"></span>
        </div>`
      }).then(i => idx = i);

      fetch("{% url 'chatbot_response' %}", {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'X-CSRFToken':getCSRFToken()
        },
        body: JSON.stringify({
          message,
          history:conversationHistory,
          mode:currentMode
        })
      })
      .then(r=>r.json())
      .then(data=>{
        botui.message.remove(idx);
        const reply = data.response||"Sorry, I didn’t understand.";
        conversationHistory.push({ role:'assistant', content:reply });
        botui.message.add({ content:reply });
      })
      .catch(()=>{
        botui.message.remove(idx);
        botui.message.add({ content:'Oops! Something went wrong.' });
      });
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      botui.message.add({ content:'Hey there! Ready to plan your day?' });

      document.getElementById('send-user-input')
        .addEventListener('click',()=>{
          sendToAssistant(document.getElementById('custom-user-input').value);
        });

      document.getElementById('custom-user-input')
        .addEventListener('keypress',e=>{
          if (e.key==='Enter') {
            e.preventDefault();
            sendToAssistant(e.target.value);
          }
        });

      document.querySelectorAll('.suggested-actions span')
        .forEach(btn=>{
          btn.addEventListener('click',()=>{
            const text = btn.textContent.trim();
            currentMode = btn.dataset.mode||'event';
            // highlight selected
            document.querySelectorAll('.suggested-actions span')
              .forEach(b=>b.classList.remove('bg-primary','text-white'));
            btn.classList.add('bg-primary','text-white','rounded');
            sendToAssistant(text);
          });
        });
    });
  </script>
  {% endblock %}
</body>
</html>
