{% load static %}

{% block head %}
<!-- Core styles -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

<!-- Assistant Styles -->
{% include 'includes/ai/ai_assistant_styles.html' %}
{% endblock head %}

{% block content %}
<div class="container-fluid main-dashboard-bg text-light" style="min-height: 100vh;">
  <div class="row">
    {% include 'includes/sidebar.html' %}
    <main class="col-12 col-md-9 col-lg-10 py-4 dashboard-content">
      {% include 'includes/ai/ai_assistant_ui.html' %}
    </main>
  </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script src="https://cdn.jsdelivr.net/npm/botui/build/botui.min.js"></script>

<script>
  const botui = new BotUI('botui-app');
  const conversationHistory = [];
  let currentMode = 'event';  // 🔁 default mode

  function getCSRFToken() {
    const name = 'csrftoken';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      if (c.trim().startsWith(name + '=')) {
        return c.trim().substring(name.length + 1);
      }
    }
    return '';
  }

  function sendToAssistant(message) {
    if (!message.trim()) return;

    conversationHistory.push({ role: 'user', content: message });

    botui.message.add({
      content: message,
      human: true,
      cssClass: 'human'
    });

    document.getElementById('custom-user-input').value = "";

    const typingHTML = `
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;

    botui.message.add({ type: 'html', content: typingHTML }).then(typingIndex => {
      fetch("{% url 'chatbot_response' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({
          message,
          history: conversationHistory,
          mode: currentMode  // 👈 include selected mode
        })
      })
      .then(r => r.json())
      .then(data => {
        botui.message.remove(typingIndex);
        const reply = data.response || "Sorry, I didn’t understand.";
        conversationHistory.push({ role: 'assistant', content: reply });

        botui.message.add({
          content: reply
        });
      })
      .catch(() => {
        botui.message.remove(typingIndex);
        botui.message.add({ content: 'Oops! Something went wrong.' });
      });
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    botui.message.add({ content: 'Hey there! Ready to plan your day?' });

    document.getElementById('send-user-input').addEventListener('click', () => {
      const message = document.getElementById('custom-user-input').value;
      sendToAssistant(message);
    });

    document.getElementById('custom-user-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const message = e.target.value;
        sendToAssistant(message);
      }
    });

    document.querySelectorAll('.suggested-actions span').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.textContent.trim();
        const mode = btn.dataset.mode || 'event';
        currentMode = mode;

        // Optional: highlight selected mode
        document.querySelectorAll('.suggested-actions span').forEach(b => b.classList.remove('active-mode'));
        btn.classList.add('active-mode');

        sendToAssistant(text);
      });
    });
  });
</script>

<!-- Typing animation -->
<style>
  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 5px 12px;
    background: #3a3a3c;
    border-radius: 12px;
    align-items: center;
    justify-content: center;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background-color: #d1d1d6;
    border-radius: 50%;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typing-bounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40% { transform: scale(1.4); opacity: 1; }
  }

  .suggested-actions span.active-mode {
    background-color: #5ac8fa;
    color: white;
    border-radius: 8px;
    padding: 4px 10px;
  }
</style>
{% endblock %}
