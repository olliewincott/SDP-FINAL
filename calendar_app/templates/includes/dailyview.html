{% load static %}

<!-- Scrollable Daily Calendar Container -->
<div id="daily-calendar-container">
    <div id="dashboard-calendar"></div>
</div>

<!-- FullCalendar Scripts -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.js"></script>

<style>
    /* Calendar container */
    #daily-calendar-container {
        width: 100%;
        height: 500px;
        overflow-y: auto;
        background-color: #2c2f36;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.05);
    }
  
    /* Scrollable content area */
    .fc-timegrid-container {
        max-height: 500px;
        overflow-y: auto !important;
        background-color: #2c2f36 !important;
    }
  
    /* Remove headers and toolbar */
    .fc-toolbar,
    .fc-col-header-cell {
        display: none !important;
    }
  
    /* Time column and background */
    .fc-timegrid-col-frame {
        background-color: #2c2f36 !important;
    }
  
    /* Subtle slot borders */
    .fc-timegrid-slot {
        border-top: 1px solid #3d4049 !important;
    }
  
    /* Time label styling */
    .fc-timegrid-slot-label {
        color: #b0b3b8;
        font-weight: 500;
        font-size: 0.85em;
    }
  
    /* Event block */
    .fc-event {
        background-color: rgba(0, 123, 255, 0.8); /* Bright blue */
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 0.85em;
        padding: 3px 6px;
        border-radius: 6px;
        transition: background-color 0.2s ease;
    }
  
    /* Hover state */
    .fc-event:hover {
        background-color: rgba(0, 123, 255, 1);
    }
  
    /* Optional: today's indicator line */
    .fc-now-indicator {
        background-color: #ff5c5c !important;
    }
  </style>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const now = new Date();
  
      // Format current time into HH:MM:SS for scrollTime (e.g., "14:30:00")
      const pad = (n) => n.toString().padStart(2, '0');
      const scrollTime = `${pad(now.getHours())}:${pad(now.getMinutes())}:00`;
  
      const calendarEl = document.getElementById('dashboard-calendar');
  
      const calendar = new FullCalendar.Calendar(calendarEl, {
        themeSystem: 'bootstrap',
        initialView: 'timeGridDay',
        height: 500,
        headerToolbar: false,
        dayHeaders: false,
        allDaySlot: false,
        slotMinTime: '00:00:00',
        slotMaxTime: '24:00:00',
        scrollTime: scrollTime,  // 👈 This auto-scrolls to current time
        nowIndicator: true,
        slotDuration: '00:30:00',
        slotLabelInterval: '01:00:00',
        now: new Date(), // For accuracy in "now" indicator
        events: "{% url 'events_json' %}",
        eventContent: function (arg) {
          return { html: `<span>${arg.event.title}</span>` };
        }
      });
  
      calendar.render();
    });
  </script>
