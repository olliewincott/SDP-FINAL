<!-- Task Modal -->
<div id="addTaskModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
  <form id="addTaskForm" class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 space-y-5 relative">
    
    <!-- Close Button -->
    <button type="button" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-xl" data-close-modal>
      &times;
    </button>

    <!-- Header -->
    <h3 id="addTaskModalLabel" class="text-lg font-semibold text-gray-800">Add New Task</h3>

    <!-- Hidden user ID -->
    <input type="hidden" name="user_id" value="{{ request.user.id }}">

    <!-- Title -->
    <div>
      <label for="task-title" class="block text-sm font-medium text-gray-700">Title</label>
      <input type="text" id="task-title" name="title" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-primary focus:border-primary text-sm text-gray-900">
    </div>

    <!-- Description -->
    <div>
      <label for="task-description" class="block text-sm font-medium text-gray-700">Description</label>
      <textarea id="task-description" name="description" rows="3"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-primary focus:border-primary text-sm text-gray-900"></textarea>
    </div>

    <!-- Due Date -->
    <div>
      <label for="task-due-date" class="block text-sm font-medium text-gray-700">Due Date</label>
      <input type="datetime-local" id="task-due-date" name="due_date" required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-primary focus:border-primary text-sm text-gray-900">
    </div>

    <!-- Footer Buttons -->
    <div class="flex justify-end gap-3 pt-3">
      <button type="button" data-close-modal
        class="px-4 py-2 text-sm text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
      <button type="submit"
        class="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-md shadow-sm">Create Task</button>
    </div>
  </form>
</div>
