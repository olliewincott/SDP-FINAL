<!-- Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="addTaskForm" class="modal-content text-dark">
      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="addTaskModalLabel">Add New Task</h5>
        <!-- Bootstrap 5 btn-close renders a nice X -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <input type="hidden" name="user_id" value="{{ request.user.id }}">
        <div class="mb-3">
          <label for="task-title" class="form-label">Title</label>
          <input type="text" class="form-control" id="task-title" name="title" required>
        </div>
        <div class="mb-3">
          <label for="task-description" class="form-label">Description</label>
          <textarea class="form-control" id="task-description" name="description"></textarea>
        </div>
        <div class="mb-3">
          <label for="task-due-date" class="form-label">Due Date</label>
          <input type="datetime-local" class="form-control" id="task-due-date" name="due_date" required>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Create Task</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </form>
  </div>
</div>
