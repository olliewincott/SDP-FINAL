<div class="mood-tracker-content">
  <h5 class="mb-3">Mood Tracker</h5>
  <form id="mood-form" method="post">
    {% csrf_token %}
    <!-- Emoji Selector with Font Awesome Icons -->
    <div class="form-group">
      <label>How are you feeling today?</label>
      <div class="emoji-selector d-flex justify-content-around">
        <button type="button" class="emoji-btn" data-rating="1">
          <i class="fas fa-angry"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="3">
          <i class="fas fa-frown"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="5">
          <i class="fas fa-meh"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="7">
          <i class="fas fa-smile"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="10">
          <i class="fas fa-grin-stars"></i>
        </button>
      </div>
      <!-- Hidden input to store selected mood rating -->
      <input type="hidden" name="mood_rating" id="mood_rating" value="5">
    </div>
    
    <!-- Toggle for Optional Comments -->
    <div class="form-group mt-3">
      <label class="toggle-note" style="cursor: pointer;">
        Add a note for this mood (optional) <i class="fas fa-chevron-down"></i>
      </label>
      <textarea class="form-control note-textarea" name="note" rows="3" placeholder="Write your note here..." style="display: none;"></textarea>
    </div>
    
    <!-- Feedback Message -->
    <div id="mood-feedback" class="text-success mt-2" style="display: none;"></div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary mt-3">Submit Mood</button>
  </form>
</div>

<style>
  /* Container for Mood Tracker */
  .mood-tracker-content h5 {
    margin-bottom: 1rem;
    color: #d1d1d6;
  }
  .mood-form {
    margin-top: 10px;
  }
  .mood-form label {
    color: #d1d1d6;
    font-weight: 500;
  }

  /* Emoji Selector Styling */
  .emoji-selector {
    display: flex;
    justify-content: space-around;
    margin-top: 0.5rem;
  }
  .emoji-btn {
    background: none;
    border: none;
    font-size: 2.5rem;
    color: #d1d1d6;
    cursor: pointer;
    transition: transform 0.1s ease, color 0.2s;
  }
  .emoji-btn:hover {
    transform: scale(1.2);
  }
  .emoji-btn.selected {
    color: #5AC8FA; /* Matches your wellness icon accent */
  }

  /* Toggle note styling */
  .toggle-note {
    display: block;
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }

  /* Textarea for note */
  .note-textarea {
    background-color: #2c2c2e;
    color: #d1d1d6;
    border: 1px solid #5a5a5a;
  }
  .note-textarea:focus {
    border-color: #5AC8FA;
    box-shadow: 0 0 0 0.2rem rgba(60,120,210,0.5);
  }

  /* Submit Button Styling */
  .mood-form .btn-primary {
    background-color: #5AC8FA;
    border-color: #5AC8FA;
    color: #fff;
  }
  .mood-form .btn-primary:hover {
    background-color: #48b2e1;
    border-color: #48b2e1;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('mood-form');
    const emojiButtons = document.querySelectorAll('.emoji-btn');
    const moodRatingInput = document.getElementById('mood_rating');
    const noteToggle = document.querySelector('.toggle-note');
    const noteTextarea = document.querySelector('.note-textarea');
    const feedback = document.getElementById('mood-feedback');

    // Emoji selection
    emojiButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        emojiButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        moodRatingInput.value = btn.dataset.rating;
      });
    });

    // Toggle note
    noteToggle.addEventListener('click', () => {
      const isOpen = noteTextarea.style.display === 'block';
      noteTextarea.style.display = isOpen ? 'none' : 'block';
      noteToggle.innerHTML = `Add a note for this mood (optional) <i class="fas fa-chevron-${isOpen ? 'down' : 'up'}"></i>`;
    });

    // AJAX submit
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new URLSearchParams();
      formData.append('mood_rating', moodRatingInput.value);
      formData.append('note', noteTextarea.value);

      fetch("{% url 'create_mood_entry' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'X-Requested-With': 'XMLHttpRequest',
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          form.reset();
          feedback.textContent = 'Mood successfully recorded!';
          feedback.style.display = 'block';
          noteTextarea.style.display = 'none';
          emojiButtons.forEach(b => b.classList.remove('selected'));
          moodRatingInput.value = '5';
          setTimeout(() => feedback.style.display = 'none', 3000);
        } else {
          alert('Failed to save mood.');
        }
      })
      .catch(err => {
        console.error('Mood submit error:', err);
        alert('Something went wrong.');
      });
    });

    function getCSRFToken() {
      const name = 'csrftoken';
      const cookies = document.cookie.split(';');
      for (let c of cookies) {
        if (c.trim().startsWith(name + '=')) {
          return c.trim().substring(name.length + 1);
        }
      }
      return '';
    }
  });
</script>
