<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md">
  <form id="mood-form" method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Mood Emojis -->
    <div>
      <label class="block text-xl font-semibold text-gray-800 mb-4">How are you feeling today?</label>
      <div class="flex justify-between items-center gap-2 text-3xl">
        <button type="button" class="emoji-btn text-gray-400 hover:text-red-500" data-rating="1" title="Very Bad 😠">😠</button>
        <button type="button" class="emoji-btn text-gray-400 hover:text-orange-400" data-rating="3" title="Bad 🙁">🙁</button>
        <button type="button" class="emoji-btn text-gray-400 hover:text-yellow-400" data-rating="5" title="Okay 😐">😐</button>
        <button type="button" class="emoji-btn text-gray-400 hover:text-green-500" data-rating="7" title="Good 🙂">🙂</button>
        <button type="button" class="emoji-btn text-gray-400 hover:text-blue-500" data-rating="10" title="Excellent 🤩">🤩</button>
      </div>
      <input type="hidden" name="mood_rating" id="mood_rating" value="5">
    </div>

    <!-- Toggleable Note -->
    <div>
      <label class="block font-medium text-gray-600 cursor-pointer toggle-note">
        Add a note (optional) <i class="fas fa-chevron-down ml-1"></i>
      </label>
      <textarea name="note" rows="3" placeholder="Write your note..." class="note-textarea mt-2 hidden w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400 text-sm text-gray-800 resize-none transition-all"></textarea>
    </div>

    <!-- Feedback -->
    <div id="mood-feedback" class="hidden text-green-600 font-medium"></div>

    <!-- Submit -->
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow-sm transition duration-200 mood-submit">
      Submit Mood
    </button>
  </form>
</div>

<style>
  .emoji-btn {
    transition: transform 0.2s ease-in-out;
  }

  .emoji-btn.selected {
    transform: scale(1.4);
    background-color: rgba(90, 200, 250, 0.1);
    border-radius: 9999px;
    padding: 0.25rem;
    box-shadow: 0 0 6px rgba(90, 200, 250, 0.4);
  }

  .mood-submit:active {
    animation: bounce 0.3s ease-in-out;
  }

  @keyframes bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('mood-form');
    const emojiButtons = document.querySelectorAll('.emoji-btn');
    const moodInput = document.getElementById('mood_rating');
    const noteToggle = document.querySelector('.toggle-note');
    const noteTextarea = document.querySelector('.note-textarea');
    const feedback = document.getElementById('mood-feedback');

    emojiButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        emojiButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        moodInput.value = btn.dataset.rating;
      });
    });

    noteToggle.addEventListener('click', () => {
      const isVisible = noteTextarea.classList.contains('hidden');
      noteTextarea.classList.toggle('hidden');
      noteToggle.innerHTML = `Add a note (optional) <i class="fas fa-chevron-${isVisible ? 'up' : 'down'} ml-1"></i>`;
    });

    form.addEventListener('submit', e => {
      e.preventDefault();

      const formData = new URLSearchParams();
      formData.append('mood_rating', moodInput.value);
      formData.append('note', noteTextarea.value);

      fetch("{% url 'create_mood_entry' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'X-Requested-With': 'XMLHttpRequest',
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          form.reset();
          emojiButtons.forEach(b => b.classList.remove('selected'));
          moodInput.value = '5';
          feedback.textContent = "🎉 Mood successfully recorded!";
          feedback.classList.remove('hidden');

          confetti({
            particleCount: 100,
            spread: 80,
            origin: { y: 0.4 },
            colors: ['#5AC8FA', '#34c759', '#ffcc00']
          });

          setTimeout(() => feedback.classList.add('hidden'), 3000);
        } else {
          alert("Something went wrong saving your mood.");
        }
      })
      .catch(() => {
        alert("Error submitting mood.");
      });
    });

    function getCSRFToken() {
      const name = 'csrftoken';
      return document.cookie.split(';').find(c => c.trim().startsWith(name + '='))?.split('=')[1] || '';
    }
  });
</script>
