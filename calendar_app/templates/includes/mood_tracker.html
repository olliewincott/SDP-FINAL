<div class="mood-tracker-content">
  <form id="mood-form" method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>How are you feeling today?</label>
      <div class="emoji-selector d-flex justify-content-around">
        <button type="button" class="emoji-btn" data-rating="1" title="Very Bad 😠">
          <i class="fas fa-angry"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="3" title="Bad 🙁">
          <i class="fas fa-frown"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="5" title="Okay 😐">
          <i class="fas fa-meh"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="7" title="Good 🙂">
          <i class="fas fa-smile"></i>
        </button>
        <button type="button" class="emoji-btn" data-rating="10" title="Excellent 🤩">
          <i class="fas fa-grin-stars"></i>
        </button>
      </div>
      <input type="hidden" name="mood_rating" id="mood_rating" value="5">
    </div>

    <div class="form-group mt-3">
      <label class="toggle-note" style="cursor: pointer;">
        Add a note for this mood (optional) <i class="fas fa-chevron-down"></i>
      </label>
      <textarea class="form-control note-textarea" name="note" rows="3" placeholder="Write your note here..." style="display: none;"></textarea>
    </div>

    <div id="mood-feedback" class="text-success mt-2" style="display: none;"></div>
    <button type="submit" class="btn btn-primary mt-3 mood-submit">Submit Mood</button>
  </form>
</div>

<style>
  .emoji-btn {
    background: none;
    border: none;
    font-size: 2.5rem;
    color: #d1d1d6;
    cursor: pointer;
    transition: transform 0.2s, color 0.3s, box-shadow 0.3s;
  }

  .emoji-btn:hover {
    transform: scale(1.2);
    color: #5AC8FA;
  }

  .emoji-btn.selected {
    color: #5AC8FA;
    transform: scale(1.3);
    box-shadow: 0 0 10px rgba(90, 200, 250, 0.6);
    border-radius: 50%;
    background-color: rgba(90, 200, 250, 0.05);
  }

  .note-textarea {
    background-color: #2c2c2e;
    color: #d1d1d6;
    border: 1px solid #5a5a5a;
  }

  .note-textarea:focus {
    border-color: #5AC8FA;
    box-shadow: 0 0 0 0.2rem rgba(60,120,210,0.5);
  }

  .mood-submit:active {
    animation: bounce 0.3s ease-in-out;
  }

  @keyframes bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('mood-form');
    const emojiButtons = document.querySelectorAll('.emoji-btn');
    const moodRatingInput = document.getElementById('mood_rating');
    const noteToggle = document.querySelector('.toggle-note');
    const noteTextarea = document.querySelector('.note-textarea');
    const feedback = document.getElementById('mood-feedback');

    emojiButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        emojiButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        moodRatingInput.value = btn.dataset.rating;
      });
    });

    noteToggle.addEventListener('click', () => {
      const isOpen = noteTextarea.style.display === 'block';
      noteTextarea.style.display = isOpen ? 'none' : 'block';
      noteToggle.innerHTML = `Add a note for this mood (optional) <i class="fas fa-chevron-${isOpen ? 'down' : 'up'}"></i>`;
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new URLSearchParams();
      formData.append('mood_rating', moodRatingInput.value);
      formData.append('note', noteTextarea.value);

      fetch("{% url 'create_mood_entry' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'X-Requested-With': 'XMLHttpRequest',
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          form.reset();
          feedback.textContent = '🎉 Mood successfully recorded!';
          feedback.style.display = 'block';
          noteTextarea.style.display = 'none';
          emojiButtons.forEach(b => b.classList.remove('selected'));
          moodRatingInput.value = '5';
          setTimeout(() => feedback.style.display = 'none', 3000);

          // 🎊 Confetti!
          confetti({
            particleCount: 120,
            spread: 90,
            origin: { y: 0.4 },
            colors: ['#5AC8FA', '#34c759', '#ffcc00']
          });
        } else {
          alert('Failed to save mood.');
        }
      })
      .catch(() => {
        alert('Something went wrong.');
      });
    });

    function getCSRFToken() {
      const name = 'csrftoken';
      const cookies = document.cookie.split(';');
      for (let c of cookies) {
        if (c.trim().startsWith(name + '=')) {
          return c.trim().substring(name.length + 1);
        }
      }
      return '';
    }
  });
</script>
