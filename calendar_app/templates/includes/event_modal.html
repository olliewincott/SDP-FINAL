<!-- Event Modal (Shared Across Views) -->
<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="addEventForm" class="modal-content text-dark">
      <div class="modal-header">
        <h5 class="modal-title" id="addEventModalLabel">Add New Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" name="id" id="event-id">
        <input type="hidden" id="user-id" name="user_id" value="{{ request.user.id }}">

        <div class="mb-3">
          <label for="event-title" class="form-label">Title</label>
          <input type="text" class="form-control" id="event-title" name="title" required>
        </div>

        <div class="mb-3">
          <label for="event-description" class="form-label">Description</label>
          <textarea class="form-control" id="event-description" name="description"></textarea>
        </div>

        <div class="mb-3">
          <label for="event-category" class="form-label">Category</label>
          <select class="form-control" id="event-category" name="category_id" required>
            <option value="" disabled selected>Select a category</option>
            {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="event-start" class="form-label">Start Time</label>
          <input type="datetime-local" class="form-control" id="event-start" name="start_time" required>
        </div>

        <div class="mb-3">
          <label for="event-end" class="form-label">End Time</label>
          <input type="datetime-local" class="form-control" id="event-end" name="end_time" required>
        </div>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-primary" id="saveEventBtn">Create Event</button>
        <button type="button" class="btn btn-danger me-auto" id="calendarDeleteEventBtn" style="display: none;">Delete</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </form>
  </div>
</div>
