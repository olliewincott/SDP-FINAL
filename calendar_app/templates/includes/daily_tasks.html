<ul id="task-list" class="space-y-3">
  <li class="text-sm text-gray-400">Loading tasks...</li>
</ul>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const taskList = document.getElementById("task-list");
  if (!taskList) return;

  window.reloadTasks = function () {
    fetch(window.tasksJsonUrl)
      .then(response => response.json())
      .then(tasks => {
        const todayStr = new Date().toLocaleDateString('en-CA');
        const todaysTasks = tasks.filter(t => {
          const dueDateStr = new Date(t.due_date).toLocaleDateString('en-CA');
          return dueDateStr === todayStr;
        });

        taskList.innerHTML = "";

        if (todaysTasks.length === 0) {
          taskList.innerHTML = "<li class='text-sm text-gray-400'>No tasks for today.</li>";
        } else {
          todaysTasks.forEach(task => {
            const li = document.createElement("li");
            li.className = "bg-white border border-gray-200 rounded-lg px-4 py-3 shadow-sm flex justify-between items-center text-sm transition hover:shadow-md";
            if (task.completed) li.classList.add("line-through", "opacity-60");
            li.dataset.taskId = task.id;

            const span = document.createElement("span");
            span.textContent = `${task.title} - Due: ${new Date(task.due_date).toLocaleDateString()}`;
            span.className = "cursor-pointer font-medium text-gray-800";
            span.addEventListener('click', function () {
              const newStatus = !task.completed;
              fetch(window.updateTaskStatusUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                  task_id: task.id,
                  completed: newStatus
                })
              })
              .then(r => r.json())
              .then(data => {
                task.completed = data.completed;
                li.classList.toggle("line-through", data.completed);
                li.classList.toggle("opacity-60", data.completed);
              })
              .catch(error => {
                console.error("Error updating task:", error);
              });
            });

            const controls = document.createElement("div");
            controls.className = "flex items-center gap-3";

            const editBtn = document.createElement("button");
            editBtn.innerHTML = '<i class="fas fa-pen text-indigo-600 hover:text-indigo-800"></i>';
            editBtn.setAttribute("data-id", task.id);
            editBtn.setAttribute("data-title", task.title);
            editBtn.setAttribute("data-description", task.description || "");
            editBtn.setAttribute("data-due-date", task.due_date);
            editBtn.classList.add("edit-task-btn", "hidden");

            const deleteBtn = document.createElement("button");
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt text-red-500 hover:text-red-700"></i>';
            deleteBtn.setAttribute("data-id", task.id);
            deleteBtn.classList.add("delete-task-btn", "hidden");

            controls.appendChild(editBtn);
            controls.appendChild(deleteBtn);

            li.appendChild(span);
            li.appendChild(controls);
            taskList.appendChild(li);
          });
        }
      })
      .catch(err => {
        console.error("Error loading tasks:", err);
        taskList.innerHTML = "<li class='text-sm text-red-400'>Error loading tasks.</li>";
      });
  }

  window.reloadTasks();

  // 🧼 Task delete logic — instant, no confirmation
  document.addEventListener('click', function (e) {
    const deleteBtn = e.target.closest('.delete-task-btn');
    if (deleteBtn) {
      const taskId = deleteBtn.dataset.id;
      fetch(`/delete_task/${taskId}/`, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken()
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const li = document.querySelector(`[data-task-id="${taskId}"]`);
          if (li) li.remove();
        } else {
          console.error("Delete failed:", data.error || "Unknown error");
        }
      })
      .catch(err => console.error("Error deleting task:", err));
    }
  });

  function getCSRFToken() {
    const name = 'csrftoken';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      if (c.trim().startsWith(name + '=')) {
        return c.trim().substring(name.length + 1);
      }
    }
    return '';
  }
});
</script>
