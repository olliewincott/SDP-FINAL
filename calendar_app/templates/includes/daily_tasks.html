{% load static %}

<style>
  .task-list-daily li {
    background-color: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 5px;
    padding: 8px 12px;
    margin-bottom: 8px;
    color: #d1d1d6;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .completed-task {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .task-controls {
    display: flex;
    gap: 8px;
  }

  .task-controls button {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 1rem;
  }

  .task-controls button:hover {
    color: #fff;
  }
</style>

<ul id="task-list" class="list-unstyled task-list-daily">
  <li>Loading tasks...</li>
</ul>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const taskList = document.getElementById("task-list");
  if (!taskList) return;

  // Publicly exposed so dashboard.js can call this
  window.reloadTasks = function () {
    fetch(window.tasksJsonUrl)
      .then(response => response.json())
      .then(tasks => {
        const todayStr = new Date().toLocaleDateString('en-CA');
        const todaysTasks = tasks.filter(t => {
          const dueDateStr = new Date(t.due_date).toLocaleDateString('en-CA');
          return dueDateStr === todayStr;
        });

        taskList.innerHTML = "";

        if (todaysTasks.length === 0) {
          taskList.innerHTML = "<li class='text-muted'>No tasks for today.</li>";
        } else {
          todaysTasks.forEach(task => {
            const li = document.createElement("li");
            li.className = task.completed ? "completed-task" : "";
            li.dataset.taskId = task.id;

            const span = document.createElement("span");
            span.textContent = `${task.title} - Due: ${new Date(task.due_date).toLocaleDateString()}`;
            span.style.cursor = "pointer";
            span.addEventListener('click', function () {
              const newStatus = !task.completed;
              fetch(window.updateTaskStatusUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                  task_id: task.id,
                  completed: newStatus
                })
              })
              .then(r => r.json())
              .then(data => {
                task.completed = data.completed;
                li.classList.toggle("completed-task", data.completed);
              })
              .catch(error => {
                console.error("Error updating task:", error);
              });
            });

            const controls = document.createElement("div");
            controls.className = "task-controls";

            const editBtn = document.createElement("button");
            editBtn.innerHTML = '<i class="fas fa-edit"></i>';
            editBtn.setAttribute("data-id", task.id);
            editBtn.setAttribute("data-title", task.title);
            editBtn.setAttribute("data-description", task.description || "");
            editBtn.setAttribute("data-due-date", task.due_date);
            editBtn.classList.add("edit-task-btn");

            const deleteBtn = document.createElement("button");
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            deleteBtn.setAttribute("data-id", task.id);
            deleteBtn.classList.add("delete-task-btn");

            controls.appendChild(editBtn);
            controls.appendChild(deleteBtn);

            li.appendChild(span);
            li.appendChild(controls);
            taskList.appendChild(li);
          });
        }
      })
      .catch(err => {
        console.error("Error loading tasks:", err);
        taskList.innerHTML = "<li>Error loading tasks.</li>";
      });
  }

  // Initial load
  window.reloadTasks();

  function getCSRFToken() {
    const name = 'csrftoken';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      if (c.trim().startsWith(name + '=')) {
        return c.trim().substring(name.length + 1);
      }
    }
    return '';
  }
});
</script>
