{% load static %}

<!-- Daily Tasks Styling -->
<style>
  .task-list-daily li {
    background-color: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 5px;
    padding: 8px 10px;
    margin-bottom: 8px;
    color: #d1d1d6;
    cursor: pointer;
    font-size: 14px;
  }

  .completed-task {
    text-decoration: line-through;
    opacity: 0.7;
  }
</style>

<!-- Daily Tasks Content -->
<ul id="task-list" class="list-unstyled task-list-daily">
  <li>Loading tasks...</li>
</ul>

<!-- Inline JS for Daily Tasks Only -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  const taskList = document.getElementById("task-list");
  if (!taskList) return;

  fetch(window.tasksJsonUrl)
    .then(response => response.json())
    .then(tasks => {
      const todayStr = new Date().toLocaleDateString('en-CA');
      const todaysTasks = tasks.filter(t => {
        const dueDateStr = new Date(t.due_date).toLocaleDateString('en-CA');
        return dueDateStr === todayStr;
      });

      taskList.innerHTML = "";

      if (todaysTasks.length === 0) {
        taskList.innerHTML = "<li>No tasks for today.</li>";
      } else {
        todaysTasks.forEach(task => {
          const li = document.createElement("li");
          li.textContent = `${task.title} - Due: ${new Date(task.due_date).toLocaleDateString()}`;

          if (task.completed) {
            li.classList.add("completed-task");
          }

          li.addEventListener('click', function () {
            const newStatus = !task.completed;
            fetch(window.updateTaskStatusUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
              },
              body: JSON.stringify({
                task_id: task.id,
                completed: newStatus
              })
            })
            .then(r => r.json())
            .then(data => {
              task.completed = data.completed;
              if (data.completed) {
                li.classList.add("completed-task");
              } else {
                li.classList.remove("completed-task");
              }
            })
            .catch(error => {
              console.error("Error updating task:", error);
            });
          });

          taskList.appendChild(li);
        });
      }
    })
    .catch(err => {
      console.error("Error loading tasks:", err);
      taskList.innerHTML = "<li>Error loading tasks.</li>";
    });

  function getCSRFToken() {
    const name = 'csrftoken';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      if (c.trim().startsWith(name + '=')) {
        return c.trim().substring(name.length + 1);
      }
    }
    return '';
  }
});
</script>
