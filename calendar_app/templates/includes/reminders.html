<h5 class="mb-3">⏰ Reminders</h5>

<ul class="list-group bg-transparent">
  {% if reminders and reminders|length > 0 %}
    {% for reminder in reminders %}
      <li class="list-group-item d-flex justify-content-between align-items-center bg-dark text-light border-0 rounded mb-2 shadow-sm px-3 py-2">
        <div class="d-flex align-items-center">
          <i class="fas fa-bell mr-2 text-info"></i>
          <span class="font-weight-semibold">{{ reminder.event.title }}</span>
        </div>
        <small class="text-muted">{{ reminder.reminder_time|date:"M j, g:i A" }}</small>
      </li>
    {% endfor %}
  {% else %}
    <li class="list-group-item bg-dark text-muted border-0 rounded shadow-sm px-3 py-2 d-flex align-items-center">
      <i class="fas fa-info-circle mr-2 text-secondary"></i>
      <span>No reminders for today.</span>
    </li>
  {% endif %}
</ul>
