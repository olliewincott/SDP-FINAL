<ul class="space-y-3" id="reminder-list">
  {% if reminders and reminders|length > 0 %}
    {% for reminder in reminders %}
      <li
        class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex justify-between items-center transition hover:shadow-md"
        data-reminder-id="{{ reminder.id }}"
      >
        <!-- Left -->
        <div>
          <p class="text-sm font-medium text-gray-800 mb-1">
            <i class="fas fa-bell text-yellow-400 mr-1"></i>
            {{ reminder.event.title }}
          </p>
          <p class="text-xs text-gray-500">{{ reminder.reminder_time|date:"M j, g:i A" }}</p>
        </div>

        <!-- Right -->
        <div class="flex items-center gap-3">
          <button
            class="text-indigo-600 hover:text-indigo-800 text-sm edit-reminder-btn hidden"
            title="Edit"
            data-id="{{ reminder.id }}"
            data-title="{{ reminder.event.title }}"
            data-time="{{ reminder.reminder_time|date:'Y-m-d\\TH:i' }}"
            data-event-id="{{ reminder.event.id }}"
          >
            <i class="fas fa-pen"></i>
          </button>
          <button
            class="text-red-500 hover:text-red-700 text-sm delete-reminder-btn hidden"
            title="Delete"
            data-id="{{ reminder.id }}"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </li>
    {% endfor %}
  {% else %}
    <li class="text-sm text-gray-400 flex items-center gap-2">
      <i class="fas fa-info-circle text-gray-300"></i>
      No reminders for today.
    </li>
  {% endif %}
</ul>
