{% load static %}

{% block head %}
<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.css" />

<style>
  /* FullCalendar Dark Mode Styling */
  body {
    background-color: #1c1c1e !important;
    color: #d1d1d6 !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
  }

  /* FullCalendar Container */
  #calendar-container {
    width: 100%;
    height: 80vh;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background-color: #1c1c1e;
    position: relative;
    border-radius: 8px;
  }

  /* Fixed Header Styling */
  .fc-header-toolbar {
    position: sticky;
    top: 0;
    background-color: #2c2c2e;
    z-index: 10;
    padding: 8px 0;
    border-bottom: 1px solid #3a3a3c;
    color: #d1d1d6;
  }

  /* Calendar Background */
  #calendar {
    width: 100%;
    max-width: 1400px;
    height: auto;
    background-color: #1c1c1e;
    border-radius: 8px;
  }

  /* Remove Vertical Grid Lines */
  .fc .fc-daygrid-day-frame,
  .fc .fc-timegrid-divider {
    border: none !important;
  }

  /* Keep Only One Line Per Hour */
  .fc-timegrid-slot {
    border-top: none !important; /* Remove all default lines */
  }

  /* Keep Only Full-Hour Lines */
  .fc-timegrid-slot.fc-timegrid-slot-lane:first-of-type {
    border-top: 1px solid rgba(255, 255, 255, 0.75) !important; /* 75% opacity for full hours */
  }

  /* Day Headers */
  .fc-col-header-cell {
    background-color: #2c2c2e !important;
    color: #d1d1d6 !important;
    font-weight: bold;
    border-bottom: 1px solid #3a3a3c;
  }

  /* Time Grid Background */
  .fc-timegrid-container {
    background-color: #1c1c1e;
    overflow-y: auto !important;
    max-height: 75vh;
  }

  /* Time Labels */
  .fc-timegrid-slot-label {
    background-color: #1c1c1e !important;
    font-weight: bold;
    color: #d1d1d6 !important;
  }

  /* Subtle Highlight for Current Day */
  .fc-day-today {
    background-color: rgba(255, 255, 255, 0.08) !important; /* Light grey tint */
  }

  /* Event Styling - 80% Opacity */
  .fc-event {
    background-color: rgba(0, 122, 255, 0.) !important; /* Apple blue with 80% opacity */
    border: none !important;
    color: #ffffff !important; /* White text */
    border-radius: 6px;
    padding: 5px;
  }

  /* Event Titles */
  .fc-event-title {
    font-size: 7px !important;
    font-weight: normal !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Highlight Today’s Date with Lighter Grey */
  .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
    background-color: rgba(255, 255, 255, 0.2) !important;
    color: white !important;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: inline-block;
    text-align: center;
    font-weight: bold;
  }

  /* Navigation Buttons */
  .fc-button {
    background-color: #3a3a3c !important;
    border: 1px solid #545458 !important;
    color: #d1d1d6 !important;
  }

  .fc-button:hover {
    background-color: #545458 !important;
  }

</style>
{% endblock head %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Weekly Timetable</h2>
  <div id="calendar-container">
    <div id="calendar"></div>
  </div>
</div>
{% endblock content %}

{% block scripts %}
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');

  var calendar = new FullCalendar.Calendar(calendarEl, {
    themeSystem: 'bootstrap',
    initialView: 'timeGridWeek',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    allDaySlot: false,  
    slotMinTime: '00:00:00',  
    slotMaxTime: '24:00:00',
    nowIndicator: true,
    slotDuration: '00:30:00',
    slotLabelInterval: '01:00:00', /* Ensures only 1-hour interval labels */

    // Load events dynamically from Django
    events: "{% url 'events_json' %}",

    // Show Only Event Title (No Descriptions)
    eventContent: function(arg) {
      return { html: `<span>${arg.event.title}</span>` };
    },

    // Apply Text Size & Remove Bold Styling
    eventDidMount: function(info) {
      info.el.style.fontSize = '7px';
      info.el.style.fontWeight = 'normal';
    }
  });

  calendar.render();

  // 🚀 Auto-scroll to 7AM but allow users to scroll back up
  setTimeout(() => {
    var scrollableContainer = document.getElementById('calendar-container');
    var hour7 = document.querySelector(".fc-timegrid-slot[data-time='07:00:00']");
    
    if (hour7) {
      scrollableContainer.scrollTop = hour7.offsetTop - 20;
    }
  }, 500);
});
</script>
{% endblock scripts %}
