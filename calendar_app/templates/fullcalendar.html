{% load static %}

{% block head %}
<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.css" />

<style>
  /* === DARK THEME OVERRIDES === */
  body {
    background-color: #1c1c1e !important;
    color: #d1d1d6 !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
  }

  #calendar-container {
    width: 100%;
    height: 80vh;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background-color: #1c1c1e;
    position: relative;
    border-radius: 8px;
  }

  .fc-header-toolbar {
    position: sticky;
    top: 0;
    background-color: #2c2c2e;
    z-index: 10;
    padding: 8px 0;
    border-bottom: 1px solid #3a3a3c;
    color: #d1d1d6;
  }

  #calendar {
    width: 100%;
    max-width: 1400px;
    height: auto;
    background-color: #1c1c1e;
    border-radius: 8px;
  }

  .fc-col-header-cell {
    background-color: #2c2c2e !important;
    color: #d1d1d6 !important;
    font-weight: bold;
    border-bottom: 1px solid #3a3a3c;
  }

  .fc-timegrid-container {
    background-color: #1c1c1e;
    overflow-y: auto !important;
    max-height: 75vh;
  }

  .fc-timegrid-slot-label {
    background-color: #1c1c1e !important;
    font-weight: bold;
    color: #d1d1d6 !important;
  }

  .fc-day-today {
    background-color: rgba(255, 255, 255, 0.08) !important;
  }

  .fc-button {
    background-color: #3a3a3c !important;
    border: 1px solid #545458 !important;
    color: #d1d1d6 !important;
  }

  .fc-button:hover {
    background-color: #545458 !important;
  }

  /* === HOURLY DIVIDER FIX === */
  .fc-timegrid-slot {
    border-top: none !important;
  }

  .fc-timegrid-slot-lane[data-time$="00:00"],
  .fc-timegrid-slot-label[data-time$="00:00"] {
    border-top: 1px solid rgba(255, 255, 255, 0.25) !important;
  }

  /* === EVENTS === */
  .fc-event {
    background-color: rgba(0, 122, 255, 0.8) !important;
    border: none !important;
    color: #ffffff !important;
    border-radius: 6px;
    padding: 5px;
  }

  .fc-event-title {
    font-size: 7px !important;
    font-weight: normal !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
    background-color: rgba(255, 255, 255, 0.2) !important;
    color: white !important;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: inline-block;
    text-align: center;
    font-weight: bold;
  }
</style>
{% endblock head %}

{% block content %}
<div class="container mt-4">
  <div id="calendar-container">
    <div id="calendar"></div>
  </div>
</div>
{% endblock content %}

{% block scripts %}
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');

  var calendar = new FullCalendar.Calendar(calendarEl, {
    themeSystem: 'bootstrap',
    initialView: 'timeGridWeek',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    allDaySlot: false,
    slotMinTime: '00:00:00',
    slotMaxTime: '24:00:00',
    nowIndicator: true,
    slotDuration: '00:30:00',
    slotLabelInterval: '01:00:00',
    events: "{% url 'events_json' %}",
    eventContent: function(arg) {
      return { html: `<span>${arg.event.title}</span>` };
    },
    eventDidMount: function(info) {
      info.el.style.fontSize = '7px';
      info.el.style.fontWeight = 'normal';
    }
  });

  calendar.render();

  setTimeout(() => {
    const container = document.getElementById('calendar-container');
    const hour7 = document.querySelector(".fc-timegrid-slot[data-time='07:00:00']");
    if (hour7) {
      container.scrollTop = hour7.offsetTop - 20;
    }
  }, 500);
});
</script>
{% endblock scripts %}
