{% load static %}

{% block head %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<style>
  /* Hide the navbar on this page */
  nav.navbar {
    display: none !important;
  }
</style>
{% endblock head %}

{% block content %}
<div class="container-fluid main-dashboard-bg text-light" style="min-height: 150vh;">
  <div class="row">
    <!-- SIDEBAR: Included from sidebar.html -->
    {% include 'includes/sidebar.html' %}
    
    <!-- MAIN CONTENT -->
    <main class="col-12 col-md-9 col-lg-10 py-3 dashboard-content">
      <!-- TOP BAR -->
      <div class="row align-items-center mb-3 rounded p-3 top-bar">
        <div class="col">
          <h2 class="mb-0">Calendar</h2>
        </div>
      </div>
      <!-- CALENDAR PLACEHOLDER -->
      <div class="row">
        <div class="col-12 mb-3">
          <div class="widget calendar">
            {% include 'fullcalendar.html' %}
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  window.eventsJsonUrl = "{% url 'events_json' %}";
</script>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/js/bootstrap.min.js"></script>
<script src="{% static 'js/calendar.js' %}"></script>
{% endblock %}
