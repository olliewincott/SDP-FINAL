{% load static %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.css" />

<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }

  #calendar-container {
    height: calc(100vh - 150px);
    overflow-y: auto;
    background-color: #1c1c1e;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  #dashboard-calendar {
    height: 100%;
    max-width: 1400px;
    margin: 0 auto;
    background-color: #1c1c1e;
    border-radius: 8px;
  }

  .fc {
    height: 100% !important;
  }

  /* ✅ Make timegrid scrollable only, no layout shift */
  #dashboard-calendar .fc-timegrid-container {
    max-height: calc(100vh - 230px) !important;
    overflow-y: scroll !important;
    margin-right: -1px; /* helps align with header when scrollbar appears */
  }

  /* ✅ Sticky + aligned day headers */
  #dashboard-calendar .fc-col-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background-color: #2c2c2e;
  }

  #dashboard-calendar .fc-col-header-cell {
    padding: 10px;
    font-weight: 600;
    background-color: #2c2c2e;
    color: #f1f1f1;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
    box-sizing: border-box;
  }

  /* Force fixed layout to avoid misalignment with timegrid */
  .fc-scrollgrid,
  .fc-scrollgrid table {
    table-layout: fixed !important;
  }

  .fc-timegrid-slot-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #e1e1e6;
  }

  .fc-day-today {
    background-color: rgba(255, 255, 255, 0.08) !important;
  }
</style>


{% endblock head %}

{% block content %}
<div class="container-fluid main-dashboard-bg text-light">
  <div class="row">
    {% include 'includes/sidebar.html' %}

    <main class="col-12 col-md-9 col-lg-10 py-3 dashboard-content">
      <div class="row align-items-center mb-3 rounded p-3 top-bar">
        <div class="col">
          <h2 class="mb-0">Calendar</h2>
        </div>
      </div>

      <div class="row">
        <div class="col-12 mb-3">
          <div id="calendar-container" class="widget calendar">
            <div id="dashboard-calendar"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

{% include 'includes/event_modal.html' %}
{% endblock content %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('dashboard-calendar');
  const modalEl = document.getElementById('addEventModal');
  const eventModal = new bootstrap.Modal(modalEl);
  const form = document.getElementById('addEventForm');
  const deleteBtn = document.getElementById('calendarDeleteEventBtn');
  const eventIdInput = document.getElementById('event-id');
  let activeEventId = null;

  const calendar = new FullCalendar.Calendar(calendarEl, {
    themeSystem: 'bootstrap',
    initialView: 'timeGridWeek',
    height: '100%',
    editable: true,
    eventResizableFromStart: true,
    headerToolbar: {
      left: 'prev today next',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    allDaySlot: false,
    nowIndicator: true,
    slotDuration: '00:30:00',
    slotLabelInterval: '01:00:00',
    slotMinTime: '00:00:00',
    slotMaxTime: '24:00:00',
    scrollTime: '06:00:00',
    dayHeaders: true,

    events: "{% url 'events_json' %}",

    eventContent(arg) {
      return { html: `<span>${arg.event.title}</span>` };
    },

    eventDidMount(info) {
      // Tippy removed as requested
    },

    dateClick(info) {
      form.reset();
      activeEventId = null;
      eventIdInput.value = '';
      deleteBtn.style.display = 'none';

      const start = new Date(info.date);
      const end = new Date(start.getTime() + 30 * 60000);
      form.querySelector('#event-start').value = start.toISOString().slice(0, 16);
      form.querySelector('#event-end').value = end.toISOString().slice(0, 16);

      eventModal.show();
    },

    eventClick(info) {
      const event = info.event;
      activeEventId = event.id;

      form.querySelector('#event-title').value = event.title;
      form.querySelector('#event-description').value = event.extendedProps.description || '';
      form.querySelector('#event-start').value = event.start.toISOString().slice(0, 16);
      form.querySelector('#event-end').value = event.end ? event.end.toISOString().slice(0, 16) : '';
      eventIdInput.value = event.id;

      deleteBtn.style.display = 'inline-block';
      eventModal.show();
    },

    eventDrop: updateEvent,
    eventResize: updateEvent
  });

  calendar.render();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const formData = new FormData(form);
    if (activeEventId) formData.append('id', activeEventId);

    fetch("{% url 'add_event' %}", {
      method: 'POST',
      headers: { 'X-CSRFToken': getCSRFToken() },
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        eventModal.hide();
        calendar.refetchEvents();
      } else {
        alert(data.error || 'Could not create/update event.');
      }
    })
    .catch(() => alert("Server error"));
  });

  deleteBtn.addEventListener('click', function () {
    if (activeEventId && confirm("Are you sure you want to delete this event?")) {
      fetch(`/delete_event/${activeEventId}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCSRFToken() }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          eventModal.hide();
          calendar.refetchEvents();
        } else {
          alert(data.error || 'Failed to delete.');
        }
      });
    }
  });

  function updateEvent(info) {
    fetch("{% url 'update_event_time' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCSRFToken()
      },
      body: JSON.stringify({
        id: info.event.id,
        start: info.event.start.toISOString(),
        end: info.event.end ? info.event.end.toISOString() : null
      })
    })
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        alert("Failed to update event.");
        info.revert();
      }
    })
    .catch(() => {
      alert("Server error.");
      info.revert();
    });
  }

  function getCSRFToken() {
    const name = 'csrftoken';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      if (c.trim().startsWith(name + '=')) {
        return c.trim().substring(name.length + 1);
      }
    }
    return '';
  }
});
</script>
{% endblock scripts %}
