{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% block head %}
  <meta charset="UTF-8">
  <title>Calendar – PLN AI</title>

  <!-- make html/body fill the viewport -->
  <style>
    html, body {
      height: 100%;
    }
  </style>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors:     { primary: '#5AC8FA' },
          fontFamily: { sans: ['Inter','sans-serif'] }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />

  <!-- FullCalendar CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/main.min.css"
  />

  <!-- Your calendar overrides (toolbar, slots, etc.) -->
  <style>
    /* full‑white panels */
    .fc-theme-standard,
    .fc-scrollgrid,
    .fc-view-harness,
    .fc-timegrid {
      background-color: #fff !important;
      color:            #111827 !important;
    }
    .fc-scrollgrid {
      border: 1px solid #e5e7eb !important;
    }
    .fc-timegrid-slot,
    .fc-timegrid-col-frame {
      background-color: #fff !important;
      border-top:       1px solid #f3f4f6 !important;
    }
    .fc-timegrid-slot-label {
      color:      #6b7280 !important;
      font-weight:500     !important;
      font-size:  0.8rem  !important;
    }

    /* toolbar & title */
    .fc-header-toolbar {
      background-color: #f9fafb !important;
      border-bottom:    1px solid #e5e7eb !important;
      padding:          8px 12px  !important;
      border-radius:    10px 10px 0 0 !important;
      font-weight:      500      !important;
      font-size:        0.95rem  !important;
      color:            #111827  !important;
    }
    .fc-toolbar-title {
      font-size:   1.1rem  !important;
      font-weight: 600     !important;
      color:       #111827 !important;
    }

    /* buttons */
    .fc-button {
      background-color: #e5e7eb    !important;
      color:            #111827    !important;
      border:           1px solid #d1d5db !important;
      border-radius:    6px         !important;
      padding:          5px 10px    !important;
      font-size:        0.85rem     !important;
      text-transform:   capitalize  !important;
      transition:       background-color 0.2s ease !important;
    }
    .fc-button:hover {
      background-color: #d1d5db !important;
    }

    /* now‑line */
    .fc-now-indicator {
      background-color: #ef4444 !important;
      height:            2px      !important;
    }
  </style>
  {% endblock head %}
</head>

<body class="bg-gray-900 text-white font-sans h-full">
  <div class="flex h-full">
    {% include 'includes/sidebar.html' %}

    <main class="flex-1 p-4 md:p-6 flex flex-col h-full">
      {% include 'includes/topbar.html' with page_title="Calendar" %}

      <!-- 
        FULL‑HEIGHT CARD: 
        flex-1 makes it grow to fill, 
        overflow-hidden keeps FC scrollbars inside.
      -->
      <section class="bg-white text-gray-900 rounded-xl shadow-md flex-1 overflow-hidden">
        <!-- 
          FC root must fill its parent.
          We'll switch its height: 'parent' in calendar.js.
        -->
        <div id="dashboard-calendar" class="h-full w-full"></div>
      </section>
    </main>
  </div>

  {% include 'includes/event_modal.html' %}

  <script>
    window.eventsJsonUrl = "{% url 'events_json' %}";
  </script>

  <!-- FullCalendar + Bootstrap theme plugin -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/main.global.min.js"></script>

  <!-- Bootstrap bundle (modal support) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- calendar initialization (with height: 'parent') -->
  <script src="{% static 'js/calendar.js' %}"></script>
</body>
</html>
