{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% block head %}
  <meta charset="UTF-8">
  <title>Calendar – FocusFlow AI</title>

  <style>
    html, body { height: 100%; }

    /* Animate calendar container */
    .calendar-container {
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .calendar-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#5AC8FA' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <!-- FullCalendar CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/main.min.css" />

  <!-- Custom Calendar Styles -->
  <style>
    .fc-theme-standard, .fc-scrollgrid, .fc-view-harness, .fc-timegrid {
      background-color: #fff !important;
      color: #111827 !important;
    }
    .fc-scrollgrid { border: 1px solid #e5e7eb !important; }
    .fc-timegrid-slot, .fc-timegrid-col-frame {
      background-color: #fff !important;
      border-top: 1px solid #f3f4f6 !important;
    }
    .fc-timegrid-slot-label {
      color: #6b7280;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .fc-header-toolbar {
      background-color: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 12px;
      border-radius: 10px 10px 0 0;
      font-weight: 500;
      font-size: 0.95rem;
      color: #111827;
    }
    .fc-toolbar-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .fc-button {
      background-color: #e5e7eb;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 9999px;
      padding: 5px 14px;
      font-size: 0.85rem;
      text-transform: capitalize;
      transition: background-color 0.2s ease;
    }
    .fc-button:hover { background-color: #d1d5db; }
    .fc-now-indicator { background-color: #ef4444 !important; height: 2px; }
    .fc { font-size: 0.92rem; }
    .fc-daygrid-day, .fc-timegrid-slot { border-radius: 6px; overflow: hidden; }
    .fc-event:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
      transition: all 0.2s ease;
    }
  </style>
  {% endblock head %}
</head>

<body class="bg-gray-900 text-white font-sans h-full">
  <div class="flex h-full">
    {% include 'includes/sidebar.html' %}

    <main class="flex-1 p-4 md:p-6 flex flex-col h-full">
      {% include 'includes/topbar.html' with page_title="Calendar" %}

      <section class="bg-white text-gray-900 rounded-xl shadow-md flex-1 overflow-hidden p-4 calendar-container">
        <div id="dashboard-calendar" class="h-full w-full"></div>
      </section>
    </main>
  </div>

  {% include 'includes/event_modal.html' %}

  <script>
    window.eventsJsonUrl = "{% url 'events_json' %}";
  </script>

  <!-- FullCalendar + Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap@6.1.8/main.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/calendar.js' %}"></script>

  <!-- Fancy Load Animation -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(() => {
        document.querySelector('.calendar-container').classList.add('show');
      }, 150);
    });
  </script>
</body>
</html>
